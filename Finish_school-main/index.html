<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./css/style.css" rel="stylesheet" />
    <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon">
    <title>毕业快乐 | Happy Graduation</title>
</head>
<body>
    <div class="box">
        <!-- 导航栏 -->
        <nav class="nav_main">
            <span class="logo">Happy graduation<span class="dot">.</span></span>
        </nav>

        <!-- 主内容区 -->
        <main class="content">
            <div class="hero-text">
                <h1 class="title-first">First</h1>
                <h2 class="title-one-day">One Day</h2>
            </div>
            
            <div class="message-card">
                <p class="message-cn">
                    毕业啦！<br>
                    一段旅程的结束，也是另一段旅程的开始。
                </p>
                <p class="message-en">
                    It's graduation!<br>
                    The end of one journey is also the beginning of another.<br>
                    May our life be full of sunshine and hope!
                </p>
            </div>

            <!-- 计时器与按钮 -->
            <div class="action-area">
                <div class="timer-wrapper">
                    <span class="timer-label">我们已经毕业：</span>
                    <strong id="uptime">计算中...</strong>
                    <span class="timer-emoji">(*๓´╰╯`๓)</span>
                </div>
                <a href="#" class="btn-goodbye">Good Bye</a>
            </div>
        </main>
    </div>

    <!-- 页脚 -->
    <footer id="footer">
        <p>© 2024 | <a href="https://nz.nzyc.top/" target="_blank">Ayl_NZ</a></p>
    </footer>

    <!-- 引入外部 JS -->
    <script src="./js/main.js"></script>
</body>
</html>
